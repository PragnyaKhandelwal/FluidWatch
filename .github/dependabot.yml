# Security fixes only.
#
# Routine version updates are OFF (open-pull-requests-limit: 0 is GitHub's
# documented switch for that), so there are no monthly minor/major PRs.
# Dependabot security updates are not affected by that limit: when an
# advisory is published for something we use, it opens a PR - all fixes for
# one component bundled together - and dependabot-auto-merge.yml merges it
# once CI passes (unless it's a major bump).
#
# Major upgrades are done deliberately, one tested PR at a time.
version: 2
updates:
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      server-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Dependabot rewrites these as e.g. `torch>=2.14.1+cpu`, which pip
      # rejects (a +cpu local label is only valid with ==). Upgrade torch
      # deliberately, re-checking the saved model checkpoint loads.
      - dependency-name: torch
      - dependency-name: torchvision

  - package-ecosystem: pip
    directory: /firmware/tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      fleet-tool-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
