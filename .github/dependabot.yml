# As few dependency PRs as possible:
#
# - ONE pull request every 6 months for the whole repo (dashboard, backend,
#   fleet.py tools and CI actions together), via a multi-ecosystem group.
# - Minor and patch versions only: majors need code changes and are done
#   deliberately, one tested PR at a time.
# - Cooldown: a version is only proposed once it has been out for 90 days,
#   so the PR carries settled releases, not last week's.
# - Security fixes are separate and not on this schedule: Dependabot opens
#   them as soon as an advisory affects us.
#
# Non-major PRs merge themselves once CI passes (dependabot-auto-merge.yml).
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: semiannually

updates:
  - package-ecosystem: bun
    directory: /frontend
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    versioning-strategy: increase
    cooldown:
      default-days: 90
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /server
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    versioning-strategy: increase
    cooldown:
      default-days: 90
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot rewrites these as e.g. `torch>=2.14.1+cpu`, which pip
      # rejects (a +cpu local label is only valid with ==). Upgrade torch
      # deliberately, re-checking the saved model checkpoint loads.
      - dependency-name: torch
      - dependency-name: torchvision

  - package-ecosystem: pip
    directory: /firmware/tools
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    versioning-strategy: increase
    cooldown:
      default-days: 90
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 90
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
