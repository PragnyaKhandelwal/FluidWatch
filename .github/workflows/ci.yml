name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    name: Dashboard (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  firmware:
    name: ESP32-CAM firmware build (PlatformIO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/esp32-cam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/esp32-cam/platformio.ini') }}
      - run: pip install platformio
      # secrets.h is gitignored - compile against the placeholder values.
      - run: cp include/secrets.h.example include/secrets.h
      - run: pio run

  e2e:
    name: End-to-end (Docker image + live API/WebSocket smoke test)
    runs-on: ubuntu-latest
    needs: backend
    env:
      API_AUTH_TOKEN: ci-e2e-token
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: iv-drip-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start backend container
        run: |
          docker run -d --name backend -p 8000:8000 \
            -e API_AUTH_TOKEN="$API_AUTH_TOKEN" iv-drip-backend:ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx websockets pillow
      - run: python server/e2e/smoke_test.py --base-url http://localhost:8000 --token "$API_AUTH_TOKEN"
      # Docker reports "starting" until its first HEALTHCHECK probe, which a
      # fast smoke test can finish before - wait for a verdict, don't race it.
      - name: Container health
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' backend)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          echo "Container health: $status"
          exit 1
      - name: Backend logs
        if: always()
        run: docker logs backend
