; Smart IV Drip System - ESP32-CAM firmware
; Board: AI-Thinker ESP32-CAM (ESP32-D0WDQ6, OV5640 5MP camera, 4MB PSRAM)
; https://docs.platformio.org/page/projectconf.html
;
; No onboard USB - flash via an external FTDI/USB-TTL adapter:
;   FTDI 5V  -> board 5V
;   FTDI GND -> board GND
;   FTDI TX  -> board U0R
;   FTDI RX  -> board U0T
; Tie GPIO0 to GND before powering on to enter flashing mode; remove that
; jumper and press reset to run normally afterwards.

[env:esp32cam]
; Pinned: the code targets Arduino-ESP32 2.0.17 (mbedtls 2, HTTPClient/WiFiClient).
; espressif32 7+ ships Arduino 3.x, which breaks ota.cpp and would also flash
; a different core than the one tested on the hardware. Upgrade deliberately.
platform = espressif32@6.12.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; PlatformIO auto-detects the port most of the time. If it can't find
; your board (or picks the wrong one when multiple serial devices are
; plugged in), uncomment and set these to whatever COM port/tty your
; FTDI adapter actually enumerated as.
; upload_port = COM9
; monitor_port = COM9

; Two 1.9 MB app slots so updates can be installed over the air while the
; current image keeps running (huge_app.csv has a single slot - no OTA).
; Switching partition tables needs one last flash over serial.
board_build.partitions = min_spiffs.csv

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1

; PSRAM is required - the OV5640 needs it for frame buffers at anything
; above the smallest resolutions, and camera init fails without it.
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
